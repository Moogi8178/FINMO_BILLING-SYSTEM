<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check your email - Finmo</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0c2b4a 0%, #0f766e 100%);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;
  }
  .card { background:#fff; border-radius:14px; padding:32px 28px; max-width:380px; width:100%; box-shadow:0 8px 30px rgba(0,0,0,0.2); text-align:center; }
  h1 { font-size:1.2rem; margin-bottom:10px; }
  p { color:#666; font-size:0.9rem; line-height:1.5; }
  a { color:#10b981; font-weight:600; text-decoration:none; display:inline-block; margin-top:18px; font-size:0.85rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>Check your email</h1>
    <p>If an account exists with that email, we've sent a link to reset your password. It may take a minute to arrive — check your spam folder too.</p>
    <a href="{% url 'login' %}">Back to login</a>
  </div>
</body>
</html>
