<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password - Finmo</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0c2b4a 0%, #0f766e 100%);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;
    position: relative; overflow: hidden;
  }
  .bg-icon { position: absolute; opacity: 0.12; color: #fff; }
  .bg-icon.top-right { top: -40px; right: -40px; width: 260px; height: 260px; }
  .bg-icon.bottom-left { bottom: -50px; left: -50px; width: 220px; height: 220px; }
  .card { background:#fff; border-radius:14px; padding:32px 28px; max-width:380px; width:100%; box-shadow:0 8px 30px rgba(0,0,0,0.2); position: relative; z-index: 1; }
  h1 { font-size:1.2rem; text-align:center; margin-bottom:4px; }
  .subtitle { text-align:center; color:#666; font-size:0.9rem; margin-bottom:24px; }
  label { display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px; margin-top:16px; }
  input { width:100%; padding:12px 14px; border:1px solid #d5d9dd; border-radius:8px; font-size:1rem; }
  button { width:100%; margin-top:24px; padding:14px; background:#10b981; color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; }
  button:hover { background:#059669; }
  .footer-link { text-align:center; margin-top:18px; font-size:0.85rem; color:#666; }
  .footer-link a { color:#10b981; font-weight:600; text-decoration:none; }
</style>
</head>
<body>
  <svg class="bg-icon top-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
    <path d="M5 13a10 10 0 0 1 14 0"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/>
    <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/><path d="M2 9a15 15 0 0 1 20 0"/>
  </svg>
  <svg class="bg-icon bottom-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
    <path d="M5 13a10 10 0 0 1 14 0"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/>
    <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/><path d="M2 9a15 15 0 0 1 20 0"/>
  </svg>
  <div class="card">
    <h1>Reset your password</h1>
    <div class="subtitle">Enter the email on your account and we'll send you a reset link.</div>
    <form method="post">
      {% csrf_token %}
      <label for="id_email">Email</label>
      <input type="email" name="email" id="id_email" required autofocus>
      <button type="submit">Send reset link</button>
    </form>
    <div class="footer-link"><a href="{% url 'login' %}">Back to login</a></div>
  </div>
</body>
</html>
