<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password reset - Finmo</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0c2b4a 0%, #0f766e 100%);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;
  }
  .card { background:#fff; border-radius:14px; padding:32px 28px; max-width:380px; width:100%; box-shadow:0 8px 30px rgba(0,0,0,0.2); text-align:center; }
  h1 { font-size:1.2rem; margin-bottom:10px; }
  p { color:#666; font-size:0.9rem; line-height:1.5; margin-bottom:20px; }
  a { color:#fff; background:#10b981; font-weight:600; text-decoration:none; display:inline-block; padding:10px 20px; border-radius:8px; font-size:0.85rem; margin: 4px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Password updated</h1>
    <p>Your password has been reset successfully. You can now log in with your new password.</p>
    <a href="{% url 'login' %}">Business owner login</a>
    <p style="margin-top:12px; font-size:0.8rem;">Customers: return to your WiFi provider's login page (check your bookmarks or the link they gave you).</p>
  </div>
</body>
</html>
